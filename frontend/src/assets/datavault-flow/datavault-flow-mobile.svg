<svg class="dv-flow dv-flow--mobile" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 600" role="img" aria-labelledby="dv-mt" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<path id="dv-tick-m" d="M-4 0l3 3.5 5.5-7"/>
<g id="dv-row-m"><rect class="bl" width="36" height="7" rx="2"/><rect class="bl" x="44" width="36" height="7" rx="2"/><rect class="bl" x="88" width="36" height="7" rx="2"/></g>
<g id="dv-rec-m"><rect class="ba" width="22" height="8" rx="2" opacity=".85"/><rect class="ba" x="26" width="22" height="8" rx="2" opacity=".55"/><rect class="ba" x="52" width="22" height="8" rx="2" opacity=".3"/></g>
<marker id="dv-ah-m" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4 0 8z" class="ba"/></marker>
</defs><style>.dv-flow{--dv-bg:#0a0b0c;--dv-fg:#ecefef;--dv-mut:#8a9290;--dv-ln:#2a2f2f;--dv-card:#111414;--dv-acc:#2fbfa0;--dv-warn:#d9a441}
.dv-flow[data-theme="light"]{--dv-bg:#f6f7f7;--dv-fg:#101414;--dv-mut:#5d6766;--dv-ln:#cfd6d5;--dv-card:#fff;--dv-acc:#10917a;--dv-warn:#b7791f}
.dv-flow .cd{fill:var(--dv-card);stroke:var(--dv-ln);stroke-width:1.2}
.dv-flow .ln{stroke:var(--dv-ln);fill:none;stroke-width:1.2}
.dv-flow .ac{stroke:var(--dv-acc);fill:none;stroke-width:1.4}
.dv-flow .bl{fill:var(--dv-ln)}
.dv-flow .ba{fill:var(--dv-acc)}
.dv-flow .tx{fill:var(--dv-fg);font:500 12px system-ui,sans-serif}
.dv-flow .tl{font-size:15px;font-weight:600}
.dv-flow .mu{fill:var(--dv-mut);font:500 10px system-ui,sans-serif}
.dv-flow .mo{font:10px ui-monospace,Menlo,monospace;fill:var(--dv-mut)}
.dv-flow .tk{stroke:var(--dv-acc);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dv-flow .tkd{stroke:var(--dv-bg)}
.dv-flow .wn{fill:var(--dv-warn);font:600 11px system-ui,sans-serif}
.dv-flow .wr{stroke:var(--dv-warn);fill:none;stroke-width:1.6}
.dv-flow .ar{stroke:var(--dv-acc);fill:none;stroke-width:1.4;stroke-dasharray:4 5}
.dv-flow .s,.dv-flow .p,.dv-flow .w,.dv-flow .lp{opacity:0;animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:ease}
.dv-flow .a0{animation-name:dv-k0}
.dv-flow .a15{animation-name:dv-k15}
.dv-flow .a22{animation-name:dv-k22}
.dv-flow .a28{animation-name:dv-k28}
.dv-flow .a38{animation-name:dv-k38}
.dv-flow .a45{animation-name:dv-k45}
.dv-flow .a53{animation-name:dv-k53}
.dv-flow .a75{animation-name:dv-k75}
.dv-flow .a82{animation-name:dv-k82}
.dv-flow .w{animation-name:dv-kW}
.dv-flow .lp{animation-name:dv-kL}
.dv-flow .core{animation:dv-pulse 12s infinite;transform-box:fill-box;transform-origin:center}
.dv-flow .lp path.ar{animation:dv-dash 1s linear infinite}
.dv-flow .p{fill:var(--dv-acc);animation-timing-function:linear;offset-rotate:0deg}
.dv-flow .pA{animation-name:dv-pA}
.dv-flow .pB{animation-name:dv-pB}
.dv-flow .pC{animation-name:dv-pC}
.dv-flow .pL{animation-name:dv-pL}
@keyframes dv-k0{0%{opacity:0}4%,90%{opacity:1}96%,100%{opacity:0}}@keyframes dv-k15{0%,13%{opacity:0}17%,90%{opacity:1}96%,100%{opacity:0}}@keyframes dv-k22{0%,20%{opacity:0}24%,90%{opacity:1}96%,100%{opacity:0}}@keyframes dv-k28{0%,26%{opacity:0}30%,90%{opacity:1}96%,100%{opacity:0}}@keyframes dv-k38{0%,36%{opacity:0}40%,90%{opacity:1}96%,100%{opacity:0}}@keyframes dv-k45{0%,43%{opacity:0}47%,90%{opacity:1}96%,100%{opacity:0}}@keyframes dv-k53{0%,51%{opacity:0}55%,90%{opacity:1}96%,100%{opacity:0}}@keyframes dv-k75{0%,73%{opacity:0}77%,90%{opacity:1}96%,100%{opacity:0}}@keyframes dv-k82{0%,80%{opacity:0}84%,90%{opacity:1}96%,100%{opacity:0}}@keyframes dv-kW{0%,57%{opacity:0}60%,70%{opacity:1}73%,100%{opacity:0}}@keyframes dv-kL{0%,60%{opacity:0}63%,70%{opacity:1}74%,100%{opacity:0}}@keyframes dv-pulse{0%,14%,21%,37%,52%,74%,100%{transform:scale(1)}17%,24%,40%,55%,77%{transform:scale(1.14)}}@keyframes dv-dash{to{stroke-dashoffset:-9}}@keyframes dv-pA{0%,4%{offset-distance:0;opacity:0}5%{opacity:1}14%{offset-distance:100%;opacity:1}15%,100%{offset-distance:100%;opacity:0}}@keyframes dv-pB{0%,46%{offset-distance:0;opacity:0}47%{opacity:1}53%{offset-distance:100%;opacity:1}54%,100%{offset-distance:100%;opacity:0}}@keyframes dv-pC{0%,74%{offset-distance:0;opacity:0}75%{opacity:1}80%{offset-distance:100%;opacity:1}81%,100%{offset-distance:100%;opacity:0}}@keyframes dv-pL{0%,62%{offset-distance:0;opacity:0}63%{opacity:1}71%{offset-distance:100%;opacity:1}72%,100%{offset-distance:100%;opacity:0}}
.dv-paused .dv-flow *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.dv-flow .s{animation:none;opacity:1}.dv-flow .p,.dv-flow .w,.dv-flow .lp{display:none}.dv-flow .core{animation:none}}
</style>
