<g><rect class="cd" x="240" y="226" width="100" height="74" rx="10"/><text class="tx" x="290" y="246" text-anchor="middle">Document</text><rect class="ba" x="256" y="260" width="50" height="5" rx="2"/><rect class="ba" x="256" y="272" width="68" height="5" rx="2" opacity=".6"/><rect class="ba" x="256" y="284" width="36" height="5" rx="2" opacity=".4"/></g></g>
